name: Build faithful Encore Custom Laravel website

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-reference.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Laravel application
        run: |
          composer create-project laravel/laravel /tmp/encore-laravel --no-interaction --prefer-dist
          rsync -a --exclude=.git --exclude=vendor --exclude=.env --exclude=node_modules /tmp/encore-laravel/ ./
          mkdir -p resources/site public/assets/reference
      - name: Import original reference without changing its design
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request, re, base64, hashlib
          url = 'https://ec-web-final.netlify.app/'
          request = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (compatible; EncoreLaravelImporter/1.0)'})
          source = urllib.request.urlopen(request, timeout=60).read().decode('utf-8')
          if 'id="vbdoc"' not in source or '<style>' not in source:
              raise RuntimeError('Reference HTML did not include the expected original website and volleyball page.')
          destination = Path('public/assets/reference')
          destination.mkdir(parents=True, exist_ok=True)
          unique = set()
          def replace(m):
              mime,payload = m.groups()
              if mime.startswith('font/'): return m.group(0)
              ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}.get(mime,'bin')
              name=hashlib.sha256(payload.encode()).hexdigest()[:20] + '.' + ext
              if name not in unique:
                  (destination/name).write_bytes(base64.b64decode(payload))
                  unique.add(name)
              return '/assets/reference/' + name
          source=re.sub(r'data:([\w.+-]+/[\w.+-]+);base64,([A-Za-z0-9+/=]+)',replace,source)
          source=re.sub(r'<script async src="/\.netlify/scripts/hud[^>]*></script>','',source)
          Path('resources/site/encore.html').write_text(source)
          print('Original HTML:',len(source),'bytes; images:',len(unique))
          PY
      - name: Add Laravel routes and controller
        run: |
          mkdir -p app/Http/Controllers
          cat > app/Http/Controllers/WebsiteController.php <<'PHP'
          <?php

          declare(strict_types=1);

          namespace App\Http\Controllers;

          use Illuminate\Http\RedirectResponse;
          use Illuminate\Http\Response;

          /**
           * Deliver original reference DOM, CSS, fonts and scripts unmodified.
           */
          final class WebsiteController
          {
              public function index(): Response
              {
                  $html = file_get_contents(resource_path('site/encore.html'));
                  abort_if($html === false, 500, 'Website template missing.');

                  return response($html)->header('Content-Type', 'text/html; charset=UTF-8');
              }

              public function volleyball(): RedirectResponse
              {
                  return redirect('/#/volleyball');
              }
          }
          PHP
          cat > routes/web.php <<'PHP'
          <?php

          declare(strict_types=1);

          use App\Http\Controllers\WebsiteController;
          use Illuminate\Support\Facades\Route;

          Route::get('/', [WebsiteController::class, 'index'])->name('home');
          Route::get('/volleyball', [WebsiteController::class, 'volleyball'])->name('volleyball');
          PHP
          cat > README.md <<'MD'
          # Encore Custom Laravel
          
          Faithful Laravel conversion of [the original Encore Custom site](https://ec-web-final.netlify.app/), including its embedded volleyball showcase, all original visual styles and animations. Images have been extracted into `public/assets/reference` for caching; the original HTML/CSS/JavaScript and inline custom typography remain in `resources/site/encore.html`.
          
          ## Local
          
          ```bash
          composer install
          cp .env.example .env
          php artisan key:generate
          php artisan serve
          ```
          
          ## cPanel production
          
          Install PHP 8.2+, run `composer install --no-dev --optimize-autoloader`, configure `.env` for production and run `php artisan optimize`. Set the domain document root to the Laravel `public/` directory. The reference includes a few original placeholder links that are intentionally unchanged.
          MD
      - name: Install project dependencies and validate Laravel files
        run: |
          composer install --no-interaction --prefer-dist
          php -l app/Http/Controllers/WebsiteController.php
          php artisan route:list --path=volleyball
          php artisan route:list --path=/
      - name: Commit generated Laravel website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- vendor node_modules .env 2>/dev/null || true
          git commit -m "Build Laravel project from exact Encore Custom reference [skip ci]" || exit 0
          git push origin HEAD:main
