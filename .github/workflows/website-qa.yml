name: Website design and asset checks

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'resources/site/**'
      - 'resources/views/website/**'
      - 'config/site.php'
      - 'config/services.php'
      - 'config/encore.php'
      - 'public/assets/reference/**'
      - 'routes/**'
      - 'tests/Feature/EncoreWebsiteTest.php'
      - '.github/workflows/website-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite
          coverage: none
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Configure CI app key
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - name: Run website source and routing regression tests
        run: php artisan test --filter=EncoreWebsiteTest
